# Página de decisión de ApprovalB1 servida desde el VPS de backup (Coolify).
# Además del sitio estático, hace de proxy hacia el relay y el webhook de respaldo,
# para que el navegador del aprobador solo hable con este dominio (una IP para whitelist).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # GitHub Pages sirve /test/t_main sin .html: se mantiene igual.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Solo el relay de decisión (no es un proxy abierto).
    location = /relay/decision-relay {
        set $relay_host approvalb1-supabase.scalifa.cloud;
        proxy_pass https://$relay_host/functions/v1/decision-relay;
        proxy_ssl_server_name on;
        proxy_set_header Host $relay_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # Intento de emergencia directo al n8n de respaldo: solo los dos webhooks de decisión.
    location ~ ^/backup/(93fb046c-5a3c-4fe4-bad3-ebdf969546dd|8209b5ad-458f-4140-a034-6f73e01d2db9)$ {
        set $backup_host apb1-b.solsetec.com.co;
        proxy_pass https://$backup_host/webhook/$1;
        proxy_ssl_server_name on;
        proxy_set_header Host $backup_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
