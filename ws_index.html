<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Anexos | ApprovalB1</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#14243c; --muted:#5d6b82; --line:#e1e6ee; --accent:#1f9d55; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1720; --card:#17212c; --text:#e8edf3; --muted:#9aa8ba; --line:#263443; --accent:#34c26f; --err:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  button.file { width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:var(--card); color:var(--text);
    border:1px solid var(--line); border-radius:12px; padding:14px; font:inherit; cursor:pointer; }
  button.file:active { transform:scale(.99); }
  button.file[disabled] { opacity:.6; cursor:wait; }
  .ext { flex:none; min-width:44px; text-align:center; font-size:12px; font-weight:700; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--accent); border-radius:8px; padding:4px 6px; }
  .name { flex:1; word-break:break-word; }
  .go { flex:none; color:var(--accent); font-size:14px; font-weight:600; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .msg.err { color:var(--err); }
  .note { color:var(--muted); font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Anexos del documento</h1>
  <p class="sub" id="sub">Cargando…</p>
  <div id="out"></div>
  <p class="note">Los enlaces de descarga son temporales. Si no abre, vuelve a tocar el archivo.</p>
</main>
<script>
// URL de la Edge Function (verify_jwt = false, no requiere llave).
const API = "https://inxsvhkoqfuohsiwrfmt.supabase.co/functions/v1/whatsapp-attachments";
const token = new URLSearchParams(location.search).get("token") || "";
const $ = (id) => document.getElementById(id);

const MESSAGES = {
  invalid: "El enlace no es válido. Vuelve a abrirlo desde WhatsApp.",
  closed: "Este documento ya fue decidido, por lo que sus anexos ya no están disponibles.",
  not_found: "No encontré ese archivo. Puede que ya no esté disponible.",
  error: "No pude cargar los anexos en este momento. Intenta de nuevo en unos minutos.",
};

function message(text, isError) {
  const div = document.createElement("div");
  div.className = "msg" + (isError ? " err" : "");
  div.textContent = text;
  $("out").replaceChildren(div);
}

async function call(payload) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token, ...payload }),
  });
  return res.json();
}

async function download(file, button) {
  button.disabled = true;
  try {
    const data = await call({ action: "download", file });
    if (data.status === "ok" && data.url) {
      location.href = data.url; // la URL firmada fuerza la descarga con el nombre original
    } else {
      alert(MESSAGES[data.status] || MESSAGES.error);
    }
  } catch {
    alert(MESSAGES.error);
  } finally {
    setTimeout(() => { button.disabled = false; }, 1500);
  }
}

async function init() {
  if (!token) { $("sub").textContent = ""; return message(MESSAGES.invalid, true); }
  try {
    const data = await call({ action: "list" });
    if (data.status !== "ok") { $("sub").textContent = ""; return message(MESSAGES[data.status] || MESSAGES.error, true); }
    const doc = data.document || {};
    const label = [doc.type, doc.entry && "#" + doc.entry].filter(Boolean).join(" ");
    $("sub").textContent = label;
    if (!data.files.length) return message("Este documento no tiene anexos.", false);
    const list = document.createElement("ul");
    for (const file of data.files) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "file";
      btn.type = "button";
      const ext = document.createElement("span");
      ext.className = "ext";
      ext.textContent = (file.includes(".") ? file.split(".").pop() : "file").slice(0, 5);
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = file;
      const go = document.createElement("span");
      go.className = "go";
      go.textContent = "Abrir";
      btn.append(ext, name, go);
      btn.addEventListener("click", () => download(file, btn));
      li.append(btn);
      list.append(li);
    }
    $("out").replaceChildren(list);
  } catch {
    $("sub").textContent = "";
    message(MESSAGES.error, true);
  }
}
init();
</script>
</body>
</html>
